# Builds the image (quality gate inside), smoke-tests it, pushes it to Forgejo's
# container registry, then redeploys on this host — all in ONE job.
#
# Runner specifics (host-Docker-socket model, see docs/DEPLOYMENT.md):
# - `runs-on: docker` -> catthehacker/ubuntu:act-latest; docker build/push run
#   against the HOST daemon through the mounted socket.
# - Pushes go to localhost:3000 (Forgejo's host-published port) because Caddy
#   413s large layer uploads via git.gjessing.io. Registry storage is
#   hostname-agnostic, so the image is pulled as git.gjessing.io/... as usual.
# - Auth is a PAT with write:package stored as the REGISTRY_TOKEN repo secret;
#   the automatic GITHUB_TOKEN only gets package *read* on this instance.
# - Deploy runs inside the build job on purpose: the single runner has
#   capacity 1 shared by every repo, so a separate `needs:` job queues for a
#   second turn and gets auto-cancelled if another commit lands meanwhile —
#   silently skipping the deploy while the run shows green.
# - scripts/ci-deploy.sh reads only this app’s deploy files through the host
#   daemon; no shared runner configuration changes are required.
name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
  workflow_dispatch:

env:
  # Public name — what deployments pull (HTTPS via Caddy).
  IMAGE: git.gjessing.io/gjessing1/luma-backend
  # Push name — straight to Forgejo's host-published port, avoiding Caddy.
  PUSH_IMAGE: localhost:3000/gjessing1/luma-backend

jobs:
  build-and-deploy:
    runs-on: docker
    permissions:
      contents: read
      packages: write # not sufficient alone on this instance; push uses REGISTRY_TOKEN
    env:
      DOCKER_BUILDKIT: '1' # required for the Dockerfile's RUN --mount=type=cache
      DEPLOY_DIR: /home/gjessing/docker/luma
    steps:
      - uses: actions/checkout@v4

      # Written directly instead of `docker login`: login pings the registry from
      # the job container (where localhost:3000 is unreachable), but the push runs
      # on the host daemon (where it works). Both hostnames are authed — pushes go
      # to localhost:3000, the deploy's compose pull to git.gjessing.io.
      - name: Registry auth
        run: |
          mkdir -p ~/.docker
          auth=$(printf 'gjessing1:%s' "${{ secrets.REGISTRY_TOKEN }}" | base64 -w0)
          printf '{"auths":{"localhost:3000":{"auth":"%s"},"git.gjessing.io":{"auth":"%s"}}}' \
            "$auth" "$auth" > ~/.docker/config.json

      - name: Build image
        run: |
          SHA_TAG="${GITHUB_SHA::7}"
          docker build --progress=plain -f backend/Dockerfile \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            -t "$IMAGE:latest" -t "$IMAGE:$SHA_TAG" \
            -t "$PUSH_IMAGE:latest" -t "$PUSH_IMAGE:$SHA_TAG" .

      # A green gate proves the code compiles; it does not prove the image RUNS.
      # Boot it and require /api/health before anything is pushed. Polled via
      # `docker exec` because a host-published port is unreachable from here.
      - name: Smoke test — the image must actually boot
        run: |
          SHA_TAG="${GITHUB_SHA::7}"
          cid=$(docker run -d -e LUMA_DATA_DIR=/tmp/data "$IMAGE:$SHA_TAG")
          ok=""
          for i in $(seq 1 30); do
            if docker exec "$cid" node -e "fetch('http://127.0.0.1:3048/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" 2>/dev/null; then
              ok=1; break
            fi
            sleep 1
          done
          echo "----- container logs -----"; docker logs "$cid" 2>&1 | tail -40 || true
          docker rm -f "$cid" >/dev/null 2>&1 || true
          if [ -z "$ok" ]; then echo "::error::built image failed to serve /api/health"; exit 1; fi
          echo "image booted and served /api/health"

      - name: Push image
        run: |
          SHA_TAG="${GITHUB_SHA::7}"
          docker push "$PUSH_IMAGE:latest"
          docker push "$PUSH_IMAGE:$SHA_TAG"

      # Guarded on main because this also runs for v* tags and workflow_dispatch.
      - name: Pull and restart
        if: github.ref == 'refs/heads/main'
        run: |
          scripts/ci-deploy.sh

      # Fail loudly if the stack came back on the old image, so a lost deploy
      # shows up as a red run instead of a green one with a stale container.
      - name: Verify deploy
        if: github.ref == 'refs/heads/main'
        run: |
          built=$(docker image inspect --format '{{.Id}}' "$IMAGE:latest")
          running=$(docker inspect --format '{{.Image}}' luma-backend)
          if ! printf '%s\n' "$running" | grep -qFx "$built"; then
            echo "no running container uses the image just built ($built)" >&2
            docker ps --filter name=luma-backend >&2
            exit 1
          fi
          for attempt in $(seq 1 20); do
            if docker exec luma-backend node -e "fetch('http://127.0.0.1:3048/api/health').then(r=>r.json()).then(h=>{if(h.gitSha!==process.argv[1])process.exit(1)})" "$GITHUB_SHA" 2>/dev/null; then
              echo "deployed $built at $GITHUB_SHA"; exit 0
            fi
            sleep 3
          done
          echo "luma-backend did not report $GITHUB_SHA on /api/health" >&2
          docker logs --tail 50 luma-backend >&2 || true
          exit 1
