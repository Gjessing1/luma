# Reference deploy file. The live copy lives in /home/gjessing/docker/productivity/luma
# (compose + .env), created by scripts/host-setup.sh; CI runs
# `docker compose pull && up -d` there on every push to main.
services:
  backend:
    image: git.gjessing.io/gjessing1/luma-backend:latest
    container_name: luma-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      LUMA_DATA_DIR: /data
    ports:
      # Loopback + docker bridge only; Caddy is the public entry point.
      - '127.0.0.1:3048:3048'
      - '172.17.0.1:3048:3048'
    volumes:
      - type: bind
        source: /home/gjessing/data/luma
        target: /data
        bind:
          create_host_path: false

networks:
  default:
    ipam:
      config:
        - subnet: 10.210.9.0/24
